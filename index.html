<!DOCTYPE html>
<html lang="nl" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zwembad Sorghvliedt - Onderhoud Dashboard</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 p-4 min-h-screen">

  <!-- Header -->
  <header class="max-w-5xl mx-auto bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6 flex flex-wrap justify-between items-center gap-4">
    <div class="flex items-center gap-3">
      <div class="bg-blue-600 text-white p-3 rounded-lg flex items-center justify-center">
        <i class="fa-solid fa-screwdriver-wrench text-xl"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold text-slate-900">Zwembad Sorghvliedt</h1>
        <p class="text-xs text-slate-500">Meldingssysteem Onderhoud & Defecten (Live)</p>
      </div>
    </div>
    <button onclick="toggleModal(true)" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2.5 rounded-lg text-sm transition flex items-center gap-2 shadow-sm">
      <i class="fa-solid fa-plus"></i>
      Nieuwe Melding
    </button>
  </header>

  <main class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-6">

    <!-- KPI Stats & Filters -->
    <section class="md:col-span-1 space-y-4">
      <div class="grid grid-cols-2 md:grid-cols-1 gap-3">
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
          <p class="text-xs font-medium text-slate-500">Openstaande Meldingen</p>
          <p id="stat-open" class="text-2xl font-bold text-amber-600 mt-1">0</p>
        </div>
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
          <p class="text-xs font-medium text-slate-500">Dringend (Hoge Prioriteit)</p>
          <p id="stat-urgent" class="text-2xl font-bold text-red-600 mt-1">0</p>
        </div>
      </div>

      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
        <h3 class="font-bold text-sm text-slate-700 border-b border-slate-100 pb-2">Filteren op</h3>
        
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Afdeling / Zone</label>
          <select id="filter-dept" onchange="applyFilters()" class="w-full bg-slate-50 border border-slate-300 rounded-lg text-xs p-2 focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="ALL">Alle Afdelingen</option>
            <option value="Groot Zwembad">Groot Zwembad</option>
            <option value="Kinderbad">Kinderbad</option>
            <option value="Kleedkamers">Kleedkamers / Lockers</option>
            <option value="Machinekamer">Machinekamer / Techniek</option>
            <option value="Onthaal">Onthaal / Ingang</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Status</label>
          <select id="filter-status" onchange="applyFilters()" class="w-full bg-slate-50 border border-slate-300 rounded-lg text-xs p-2 focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="ALL">Alle Statussen</option>
            <option value="OPEN">Actief (In afwachting / In behandeling)</option>
            <option value="RESOLVED">Opgelost</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Tickets List -->
    <section class="md:col-span-3">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-bold text-slate-700 text-sm">Overzicht Meldingen</h2>
        <span id="ticket-count" class="text-xs text-slate-500 bg-slate-200 px-2 py-0.5 rounded-full">0 meldingen</span>
      </div>

      <div id="tickets-container" class="space-y-3">
        <div class="bg-white p-8 rounded-xl text-center border border-slate-200 text-slate-400">
          <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-blue-500"></i>
          <p class="text-sm">Verbinden met Firebase database...</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Modal Form -->
  <div id="modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl border border-slate-100 relative">
      <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
        <h3 class="font-bold text-slate-800 text-base">Nieuwe Defectmelding Registreren</h3>
        <button onclick="toggleModal(false)" class="text-slate-400 hover:text-slate-600 text-lg">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="ticket-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Zone / Afdeling *</label>
          <select id="dept" required class="w-full bg-slate-50 border border-slate-300 rounded-lg text-sm p-2.5 outline-none focus:ring-2 focus:ring-blue-500">
            <option value="Groot Zwembad">Groot Zwembad</option>
            <option value="Kinderbad">Kinderbad</option>
            <option value="Kleedkamers">Kleedkamers / Lockers</option>
            <option value="Machinekamer">Machinekamer / Techniek</option>
            <option value="Onthaal">Onthaal / Ingang</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Prioriteit *</label>
          <div class="grid grid-cols-3 gap-2">
            <label class="border border-slate-200 p-2 rounded-lg text-center cursor-pointer hover:bg-slate-50 text-xs">
              <input type="radio" name="priority" value="NORMAL" checked class="accent-blue-600">
              <span class="block mt-1 text-slate-700 font-medium">Normaal</span>
            </label>
            <label class="border border-amber-200 bg-amber-50/50 p-2 rounded-lg text-center cursor-pointer hover:bg-amber-100 text-xs">
              <input type="radio" name="priority" value="MEDIUM" class="accent-amber-600">
              <span class="block mt-1 text-amber-800 font-medium">Middel</span>
            </label>
            <label class="border border-red-200 bg-red-50/50 p-2 rounded-lg text-center cursor-pointer hover:bg-red-100 text-xs">
              <input type="radio" name="priority" value="HIGH" class="accent-red-600">
              <span class="block mt-1 text-red-800 font-medium">Dringend</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Beschrijving van het probleem *</label>
          <textarea id="description" required rows="3" placeholder="Bijv.: Sluiting locker #118 defect / Klein lek bij circulatiepomp 2..." class="w-full bg-slate-50 border border-slate-300 rounded-lg text-sm p-2.5 outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Gemeld door (Naam)</label>
            <input type="text" id="reporter" placeholder="Naam medewerker" class="w-full bg-slate-50 border border-slate-300 rounded-lg text-sm p-2.5 outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Locatie / Nummer / NR</label>
            <input type="text" id="asset-id" placeholder="Bijv.: Locker #118" class="w-full bg-slate-50 border border-slate-300 rounded-lg text-sm p-2.5 outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
          <button type="button" onclick="toggleModal(false)" class="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-lg">Annuleren</button>
          <button type="submit" class="px-4 py-2 text-xs font-medium bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow-sm">Melding Opslaan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase Script with Config -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDRZwD9eat9kgNkXhYZP8i",
      authDomain: "sorghvliedt-maintenance.firebaseapp.com",
      databaseURL: "https://sorghvliedt-maintenance-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "sorghvliedt-maintenance",
      storageBucket: "sorghvliedt-maintenance.appspot.com",
      messagingSenderId: "936223704650",
      appId: "1:936223704650:web:5a260f377",
      measurementId: "G-920Q5P3VP4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const ticketsRef = ref(db, "tickets");

    let rawTickets = [];

    onValue(ticketsRef, (snapshot) => {
      rawTickets = [];
      const data = snapshot.val();
      if (data) {
        Object.keys(data).forEach((key) => {
          rawTickets.push({ id: key, ...data[key] });
        });
        rawTickets.reverse();
      }
      applyFilters();
    }, (error) => {
      console.error("Firebase error:", error);
      document.getElementById('tickets-container').innerHTML = `
        <div class="bg-red-50 p-4 rounded-xl text-center text-red-600 text-sm border border-red-200">
          Fout bij verbinden met Firebase database.
        </div>`;
    });

    window.handleFormSubmit = async function(e) {
      e.preventDefault();
      const ticketData = {
        dept: document.getElementById('dept').value,
        priority: document.querySelector('input[name="priority"]:checked').value,
        status: "OPEN",
        desc: document.getElementById('description').value,
        reporter: document.getElementById('reporter').value || "Onbekend",
        assetId: document.getElementById('asset-id').value || "—",
        dateStr: new Date().toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit' })
      };

      try {
        await push(ticketsRef, ticketData);
        document.getElementById('ticket-form').reset();
        toggleModal(false);
      } catch (err) {
        alert("Fout bij opslaan: " + err.message);
      }
    };

    window.updateStatus = async function(id, newStatus) {
      const itemRef = ref(db, `tickets/${id}`);
      await update(itemRef, { status: newStatus });
    };

    window.deleteTicket = async function(id) {
      if (confirm("Weet u zeker dat u deze melding wilt verwijderen?")) {
        const itemRef = ref(db, `tickets/${id}`);
        await remove(itemRef);
      }
    };

    window.applyFilters = function() {
      const deptFilter = document.getElementById('filter-dept').value;
      const statusFilter = document.getElementById('filter-status').value;

      const filtered = rawTickets.filter(t => {
        const matchesDept = deptFilter === 'ALL' || t.dept === deptFilter;
        let matchesStatus = true;
        if (statusFilter === 'OPEN') matchesStatus = t.status !== 'RESOLVED';
        if (statusFilter === 'RESOLVED') matchesStatus = t.status === 'RESOLVED';
        return matchesDept && matchesStatus;
      });

      renderUI(filtered);
    };

    function renderUI(tickets) {
      const openCount = rawTickets.filter(t => t.status !== 'RESOLVED').length;
      const urgentCount = rawTickets.filter(t => t.priority === 'HIGH' && t.status !== 'RESOLVED').length;
      
      document.getElementById('stat-open').innerText = openCount;
      document.getElementById('stat-urgent').innerText = urgentCount;
      document.getElementById('ticket-count').innerText = `${tickets.length} meldingen`;

      const container = document.getElementById('tickets-container');
      
      if (tickets.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-8 rounded-xl text-center border border-slate-200 text-slate-400">
            <i class="fa-solid fa-check-circle text-3xl mb-2 text-slate-300"></i>
            <p class="text-sm">Geen meldingen gevonden.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = tickets.map(t => {
        let badgeColor = "bg-slate-100 text-slate-700 border-slate-200";
        let priorityBadge = "Normaal";
        if (t.priority === 'HIGH') {
          badgeColor = "bg-red-50 text-red-700 border-red-200";
          priorityBadge = "⚡ Dringend";
        } else if (t.priority === 'MEDIUM') {
          badgeColor = "bg-amber-50 text-amber-700 border-amber-200";
          priorityBadge = "Middel";
        }

        let statusBadge = `<span class="bg-amber-100 text-amber-800 text-[11px] font-medium px-2 py-0.5 rounded">⏳ In afwachting</span>`;
        if (t.status === 'IN_PROGRESS') {
          statusBadge = `<span class="bg-blue-100 text-blue-800 text-[11px] font-medium px-2 py-0.5 rounded">🛠️ In behandeling</span>`;
        } else if (t.status === 'RESOLVED') {
          statusBadge = `<span class="bg-emerald-100 text-emerald-800 text-[11px] font-medium px-2 py-0.5 rounded">✅ Opgelost</span>`;
        }

        return `
          <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm hover:border-slate-300 transition space-y-3">
            <div class="flex justify-between items-start gap-2">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="text-xs font-bold px-2.5 py-1 rounded-md border ${badgeColor}">${priorityBadge}</span>
                <span class="text-xs font-semibold text-slate-700 bg-slate-100 px-2.5 py-1 rounded-md">📍 ${t.dept}</span>
                ${statusBadge}
              </div>
            </div>

            <p class="text-sm text-slate-800 font-medium leading-relaxed">${t.desc}</p>

            <div class="flex flex-wrap justify-between items-center text-xs text-slate-500 pt-2 border-t border-slate-100 gap-2">
              <div class="flex items-center gap-3">
                <span><i class="fa-regular fa-user mr-1 text-slate-400"></i>${t.reporter}</span>
                <span><i class="fa-solid fa-tag mr-1 text-slate-400"></i>${t.assetId}</span>
                <span><i class="fa-regular fa-clock mr-1 text-slate-400"></i>${t.dateStr || ''}</span>
              </div>

              <div class="flex items-center gap-1">
                ${t.status === 'OPEN' ? `<button onclick="updateStatus('${t.id}', 'IN_PROGRESS')" class="text-blue-600 hover:bg-blue-50 px-2 py-1 rounded font-medium">Starten</button>` : ''}
                ${t.status !== 'RESOLVED' ? `<button onclick="updateStatus('${t.id}', 'RESOLVED')" class="text-emerald-600 hover:bg-emerald-50 px-2 py-1 rounded font-medium">Opgelost</button>` : ''}
                ${t.status === 'RESOLVED' ? `<button onclick="updateStatus('${t.id}', 'OPEN')" class="text-slate-500 hover:bg-slate-100 px-2 py-1 rounded">Heropenen</button>` : ''}
                <button onclick="deleteTicket('${t.id}')" class="text-slate-400 hover:text-red-600 px-1.5 py-1 rounded mr-1">
                  <i class="fa-regular fa-trash-can"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    window.toggleModal = function(show) {
      document.getElementById('modal').classList.toggle('hidden', !show);
    };
  </script>
</body>
</html>
